name: Todo App CI/CD Pipeline
on:
  push:
    branches: [ main ]
    paths:
      - 'todo-app/**'
      - '.github/workflows/todo-app-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'todo-app/**'
      - '.github/workflows/todo-app-ci-cd.yml'
env:
  IMAGE: ghcr.io/${{ github.repository }}/todo-app
jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./todo-app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Update GitOps repository
        if: github.event_name == 'push'
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          # Configure git credential store
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

          # Remove any existing gitops directory
          rm -rf gitops

          # Clone repository using HTTPS URL without token
          git clone https://github.com/m1key0m/grade-api-gitops.git gitops

          # Bootstrap the todo-app manifests on first run
          mkdir -p gitops/todo-app
          for f in deployment.yaml service.yaml; do
            [ -f "gitops/todo-app/$f" ] || cp "todo-app/k8s/$f" "gitops/todo-app/$f"
          done

          cd gitops

          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image: ${IMAGE}:.*|image: ${IMAGE}:${{ github.sha }}|g" todo-app/deployment.yaml
          else
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${{ github.sha }}|g" todo-app/deployment.yaml
          fi

          # Commit changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add todo-app
          git commit -m "Update todo-app image to ${{ github.sha }}"

          # Push
          git push https://${GIT_TOKEN}@github.com/m1key0m/grade-api-gitops.git main
